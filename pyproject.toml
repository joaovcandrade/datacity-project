[project]
name = "datacity"
version = "0.1.0"
description = "Plataforma de Indicadores de Cidade Inteligente (ISO 37120/37122/37123/37125)"
requires-python = ">=3.12"
dependencies = [
    "django==5.0.3",
    "psycopg2-binary==2.9.9",
    "djangorestframework==3.16.1",
    "django-cors-headers==4.9.0",
    "django-filter==25.1",
    "beautifulsoup4==4.13.5",
    "requests==2.32.5",
    "pandas==2.3.2",
    "numpy==2.3.3",
    "openpyxl==3.1.5",
    "python-dotenv==1.1.1",
    "pytz==2025.2",
    "gunicorn==21.2.0",
]

[project.optional-dependencies]
production = [
    "whitenoise==6.6.0",
]
dev = [
    "pytest-django==4.8.0",
    "pytest-cov==5.0.0",
    "factory-boy==3.3.0",
    "model-bakery==1.17.0",
]

[dependency-groups]
dev = [
    "pytest-django==4.8.0",
    "pytest-cov==5.0.0",
    "factory-boy==3.3.0",
    "model-bakery==1.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "datacity.settings.development"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
